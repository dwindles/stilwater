# Stilwater Online's web services (server/webservices.py): the game's GameSpy hostnames such as
# srow2pc.auth.pubsvs.openspy.net and srow2pc.sake.openspy.net, which the core resolves to this
# server. Only those names match, so other sites on the server are unaffected.
server {
    listen 80;
    listen [::]:80;
    server_name ~\.openspy\.net$ ~\.gamespy\.com$;
    client_max_body_size 4m;
    access_log /var/log/nginx/stilwater-online.log;

    location / {
        proxy_pass http://127.0.0.1:29980;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
