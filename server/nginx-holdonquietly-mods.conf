# Shared mods (server/mods.py) at https://holdonquietly.com/stilwater/mods/. Included from the
# holdonquietly.com server block (/etc/nginx/conf.d/holdonquietly.conf) as
# /etc/nginx/snippets/stilwater-mods.conf. Files are served straight from the folder; the rest goes
# to Stilwater Online's web services.

location ~ "^/stilwater/mods/file/([0-9a-f]{64})$" {
    alias /var/lib/stilwater-mods/$1;
    default_type application/octet-stream;
    expires 30d;
}

location ^~ /stilwater/mods/ {
    client_max_body_size 210m;
    # Uploads go straight through; the server checks and writes them itself.
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://127.0.0.1:29980;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
